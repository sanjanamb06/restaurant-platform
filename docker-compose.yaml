version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: restaurant
    restart: always
    environment:
      POSTGRES_USER: restaurant_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: restaurant_saas
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: